<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: Arial, sans-serif; padding: 14px; margin: 0; color: #222; }
    h3 { margin: 0 0 10px; font-size: 16px; }
    .info { background: #e3f2fd; padding: 8px 10px; margin: 0 0 12px; border-radius: 4px; font-size: 12px; }
    label { display: block; margin: 0 0 4px; font-weight: bold; font-size: 12px; }
    input.day { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    .btns { margin-top: 14px; display: flex; gap: 8px; }
    button { background: #4CAF50; color: #fff; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; flex: 1; }
    button:hover { background: #45a049; }
    button:disabled { background: #9ccc9c; cursor: default; }
    button.ghost { background: #eee; color: #333; }
    button.ghost:hover { background: #ddd; }
    .err { color: #c62828; font-size: 12px; margin-top: 8px; min-height: 16px; }
  </style>
</head>
<body>
  <h3 id="title">info</h3>
  <div class="info" id="hint"></div>
  <label for="day">Дата</label>
  <input class="day" id="day" type="date">
  <div class="err" id="err"></div>
  <div class="btns">
    <button type="button" id="go" onclick="go()">Посчитать</button>
    <button type="button" class="ghost" onclick="google.script.host.close()">Отмена</button>
  </div>
  <script>
    var DATA = <?!= payload ?>;
    document.getElementById('title').textContent = DATA.title || 'info';
    document.getElementById('hint').textContent = DATA.hint || '';
    if (DATA.day) document.getElementById('day').value = DATA.day;

    function go() {
      var day = document.getElementById('day').value;
      var err = document.getElementById('err');
      var btn = document.getElementById('go');
      err.textContent = '';
      if (!day) {
        err.textContent = 'Выберите дату';
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Считаем…';
      google.script.run
        .withSuccessHandler(function (res) {
          var sheet = (res && res.sheet) || 'info';
          var sec = res && res.ms != null ? (Number(res.ms) / 1000).toFixed(1) : '';
          document.body.innerHTML =
            '<h3>Выгрузка завершена</h3>' +
            '<div class="info">' + sheet + (sec ? ' · ' + sec + ' с' : '') + '</div>' +
            '<div class="btns"><button type="button" onclick="google.script.host.close()">ОК</button></div>';
        })
        .withFailureHandler(function (e) {
          btn.disabled = false;
          btn.textContent = 'Посчитать';
          err.textContent = e.message || String(e);
        })
        .runInfoForDate({ kind: DATA.kind, day: day });
    }
  </script>
</body>
</html>
